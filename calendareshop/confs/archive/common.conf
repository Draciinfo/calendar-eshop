# Included inside each HTTPS server. Only public archive files are served.
access_log /var/log/nginx/calendareshop-nginx-access.log;
error_log /var/log/nginx/calendareshop-nginx-error.log;

index index.html;
autoindex off;
charset utf-8;
server_tokens off;

if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;

gzip on;
gzip_vary on;
gzip_min_length 1000;
gzip_types text/plain text/css application/javascript image/svg+xml;

error_page 404 /404.html;
location = /404.html {
    internal;
}

# Old write/admin endpoints are permanently retired; never proxy to Django.
location ~ ^/(newsletter|admin|ckeditor|voting|i18n|cart|checkout|products|orders?|payment|reporting|order-report|email_test|gdpr_consent|shipping-payment|shipping_payment|doprava_platba)(/|$) {
    return 410;
}

location ~ /\. {
    deny all;
}

location /assets/ {
    expires 7d;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ =404;
}
